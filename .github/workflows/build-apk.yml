name: Build ClearLine Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies and add Android platform
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Ensure location permissions in AndroidManifest.xml
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION"
            ];
            const missing = perms
              .filter(perm => !xml.includes(perm))
              .map(perm => `    <uses-permission android:name="${perm}" />`)
              .join("\n");
            if (missing) {
              xml = xml.replace("</manifest>", `${missing}\n</manifest>`);
              fs.writeFileSync(p, xml, "utf8");
            }
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearline-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
